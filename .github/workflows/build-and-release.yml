name: "Build and Release"

# Orchestrator workflow: calls reusable workflows in sequence
# source-sync → build → package → release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag or branch to build (e.g. 130.0.6723.116 or main)'
        required: true
        type: string
      target_os:
        description: 'Target OS to build for'
        required: true
        type: choice
        options:
          - android
          - linux
          - windows
          - mac
        default: 'android'
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - Release
          - Debug
        default: 'Release'
      skip_sync:
        description: 'Skip source sync (use cached source from previous run)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ============================================================
  # Stage 1: Fetch and sync source code + dependencies
  # ============================================================
  source-sync:
    name: "1/4 Source Sync"
    if: ${{ inputs.skip_sync != true }}
    uses: ./.github/workflows/source-sync.yml
    with:
      version: ${{ inputs.version }}
      target_os: ${{ inputs.target_os }}

  # ============================================================
  # Stage 2: Compile with ccache acceleration
  # ============================================================
  build:
    name: "2/4 Build"
    needs: [source-sync]
    if: ${{ always() && (needs.source-sync.result == 'success' || needs.source-sync.result == 'skipped') }}
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}
      target_os: ${{ inputs.target_os }}
      build_type: ${{ inputs.build_type }}

  # ============================================================
  # Stage 3: Package build artifacts
  # ============================================================
  package:
    name: "3/4 Package"
    needs: [build]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ inputs.version }}
      target_os: ${{ inputs.target_os }}
      build_type: ${{ inputs.build_type }}

  # ============================================================
  # Stage 4: Create GitHub Release
  # ============================================================
  release:
    name: "4/4 Release"
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: ultimatum-packaged-${{ inputs.target_os }}-${{ inputs.version }}
          path: artifacts/

      - name: List release files
        run: |
          echo "=== Files to release ==="
          ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}-${{ inputs.target_os }}
          name: "Ultimatum ${{ inputs.version }} (${{ inputs.target_os }})"
          body: |
            ## Ultimatum ${{ inputs.version }}

            | Field | Value |
            |-------|-------|
            | **Target OS** | ${{ inputs.target_os }} |
            | **Build Type** | ${{ inputs.build_type }} |
            | **Source** | [gonzazoid/Ultimatum@${{ inputs.version }}](https://github.com/gonzazoid/Ultimatum/tree/${{ inputs.version }}) |
            | **Workflow** | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            ### Build Acceleration
            - **ccache** enabled for compilation caching
            - **Incremental build** with object file caching
            - **depot_tools** cached across runs
            - **Source code** cached for repeat builds

            ### Verification
            SHA256 checksums are included alongside each artifact.
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
