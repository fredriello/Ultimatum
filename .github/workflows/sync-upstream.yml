name: Sync Upstream

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/gonzazoid/Ultimatum.git || true
          git remote set-url upstream https://github.com/gonzazoid/Ultimatum.git

      - name: Fetch upstream
        run: |
          git fetch upstream --tags --force

      - name: Sync main branch
        run: |
          git checkout main
          git merge upstream/main --allow-unrelated-histories --no-edit || \
          git merge upstream/master --allow-unrelated-histories --no-edit || \
          echo "::warning::Could not determine upstream default branch. Trying common branch names failed."

      - name: Sync tags
        run: |
          git push origin --tags --force

      - name: Push changes
        run: |
          git push origin main
